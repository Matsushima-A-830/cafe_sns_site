<title>カフェSNS 実装ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --ink: #2e1c12;
    --ink-soft: #5b3a2a;
    --ink-faint: #9a6b4a;
    --ground: #fff8f1;
    --ground-dot: #e3cdb5;
    --paper: #ffffff;
    --frame: #ffffff;
    --frame-edge: #ecd2b8;
    --rail: #fff1e3;
    --accent: #9a6b4a;
    --done: #4a7c59;
    --done-bg: #e8f0e8;
    --partial: #c77f3e;
    --partial-bg: #fdeedd;
    --todo: #8a7e74;
    --todo-bg: #f1ece7;
    --risk: #a94438;
    --risk-bg: #fbe6e2;
    --future: #5b7c99;
    --future-bg: #e6eef4;
    --shadow: 0 1px 2px rgba(46, 28, 18, .1), 0 6px 18px rgba(46, 28, 18, .08);
    --shadow-frame: 0 2px 30px rgba(46, 28, 18, .07);
    --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #fff1e3;
      --ink-soft: #e2c8ae;
      --ink-faint: #b08f75;
      --ground: #241710;
      --ground-dot: #4a3326;
      --paper: #33231a;
      --frame: #2c1d15;
      --frame-edge: #4f382a;
      --rail: #3b2820;
      --accent: #d9b38c;
      --done: #8dc09b;
      --done-bg: #2b3a2f;
      --partial: #e7ab6b;
      --partial-bg: #443023;
      --todo: #b2a397;
      --todo-bg: #3a2e27;
      --risk: #e4907f;
      --risk-bg: #46281f;
      --future: #9cc0da;
      --future-bg: #2a3640;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 20px rgba(0, 0, 0, .3);
      --shadow-frame: 0 2px 30px rgba(0, 0, 0, .28);
    }
  }

  :root[data-theme="dark"] {
    --ink: #fff1e3;
    --ink-soft: #e2c8ae;
    --ink-faint: #b08f75;
    --ground: #241710;
    --ground-dot: #4a3326;
    --paper: #33231a;
    --frame: #2c1d15;
    --frame-edge: #4f382a;
    --rail: #3b2820;
    --accent: #d9b38c;
    --done: #8dc09b;
    --done-bg: #2b3a2f;
    --partial: #e7ab6b;
    --partial-bg: #443023;
    --todo: #b2a397;
    --todo-bg: #3a2e27;
    --risk: #e4907f;
    --risk-bg: #46281f;
    --future: #9cc0da;
    --future-bg: #2a3640;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 20px rgba(0, 0, 0, .3);
    --shadow-frame: 0 2px 30px rgba(0, 0, 0, .28);
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    height: 100vh;
  }

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--ground-dot) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
  }
  #viewport.dragging { cursor: grabbing; }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    width: 4600px;
    height: 3600px;
    transform-origin: 0 0;
  }

  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .node { position: absolute; box-sizing: border-box; }

  /* ---- frames (FigJam sections) ---- */
  .frame {
    background: var(--frame);
    border: 2px solid var(--frame-edge);
    border-radius: 18px;
    box-shadow: var(--shadow-frame);
    padding: 24px 24px 28px;
  }
  .frame > header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .frame h2 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: .01em;
    margin: 0;
  }
  .frame .tally {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: .04em;
  }
  .frame .lede {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 8px 0 20px;
    max-width: 62ch;
  }

  .stack { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }

  /* ---- sticky notes ---- */
  .sticky {
    width: 236px;
    box-sizing: border-box;
    padding: 14px 14px 16px;
    border-radius: 4px;
    background: var(--paper);
    box-shadow: var(--shadow);
    border-top: 5px solid var(--todo);
    transition: opacity .18s ease, transform .18s ease;
  }
  .sticky.wide { width: 320px; }
  .sticky.full { width: 100%; }
  .sticky .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--ink-soft);
    background: var(--rail);
    border-radius: 3px;
    padding: 2px 6px;
    margin-bottom: 8px;
  }
  .sticky h3 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    line-height: 1.45;
    margin: 0 0 6px;
  }
  .sticky p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--ink-soft);
  }
  .sticky p + p { margin-top: 6px; }
  .sticky .why {
    display: block;
    margin-top: 8px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-faint);
    border-left: 2px solid var(--frame-edge);
    padding-left: 8px;
  }
  .sticky[data-status="done"]    { border-top-color: var(--done);    background: var(--done-bg); }
  .sticky[data-status="partial"] { border-top-color: var(--partial); background: var(--partial-bg); }
  .sticky[data-status="todo"]    { border-top-color: var(--todo);    background: var(--todo-bg); }
  .sticky[data-status="risk"]    { border-top-color: var(--risk);    background: var(--risk-bg); }
  .sticky[data-status="future"]  { border-top-color: var(--future);  background: var(--future-bg); }
  .sticky.dim { opacity: .14; }

  /* ---- header card ---- */
  .titlecard { background: var(--ink); color: var(--ground); border-radius: 18px; padding: 32px 34px; box-shadow: var(--shadow-frame); }
  .titlecard .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .18em; opacity: .7; margin: 0 0 14px; }
  .titlecard h1 { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  .titlecard .sub { font-family: var(--font-display); font-size: 19px; font-weight: 500; margin: 0 0 18px; opacity: .85; }
  .titlecard p { font-size: 13.5px; line-height: 1.8; margin: 0; opacity: .8; max-width: 60ch; }
  .titlecard .stamp { font-family: var(--font-mono); font-size: 12px; margin-top: 20px; opacity: .6; }

  /* ---- plain cards ---- */
  .card { background: var(--frame); border: 2px solid var(--frame-edge); border-radius: 14px; padding: 22px 22px 24px; box-shadow: var(--shadow-frame); }
  .card h2 { font-family: var(--font-display); font-size: 18px; font-weight: 900; margin: 0 0 14px; }
  .legend-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; border: 0; background: none; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .legend-row:hover { background: var(--rail); }
  .legend-row .swatch { width: 18px; height: 18px; border-radius: 3px; flex: none; margin-top: 2px; box-shadow: inset 0 0 0 2px rgba(46,28,18,.12); }
  .legend-row b { font-family: var(--font-display); font-size: 14px; display: block; }
  .legend-row span { font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
  .legend-row[aria-pressed="true"] { background: var(--rail); box-shadow: inset 0 0 0 2px var(--accent); }
  .legend-hint { font-size: 11.5px; color: var(--ink-faint); margin: 12px 2px 0; line-height: 1.6; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile { background: var(--frame); border: 2px solid var(--frame-edge); border-radius: 14px; padding: 20px; box-shadow: var(--shadow-frame); }
  .tile .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--ink-faint); }
  .tile .v { font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 1.15; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 18px; font-weight: 700; color: var(--ink-faint); }
  .tile .n { font-size: 12px; color: var(--ink-soft); margin-top: 6px; line-height: 1.55; }
  .meter { height: 7px; border-radius: 4px; background: var(--rail); margin-top: 12px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }

  /* ---- horizon lanes ---- */
  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  .lane { border: 2px dashed var(--frame-edge); border-radius: 14px; padding: 18px; background: var(--rail); }
  .lane > h3 { font-family: var(--font-display); font-weight: 900; font-size: 19px; margin: 0 0 2px; }
  .lane > .when { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); letter-spacing: .06em; margin: 0 0 14px; }
  .lane .stack { gap: 12px; }
  .lane .sticky { width: 100%; }

  .steps { counter-reset: step; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .steps li { position: relative; padding-left: 34px; font-size: 13px; line-height: 1.65; color: var(--ink-soft); }
  .steps li::before {
    counter-increment: step; content: counter(step, decimal-leading-zero);
    position: absolute; left: 0; top: 1px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--accent); border: 1.5px solid var(--frame-edge); border-radius: 4px; padding: 1px 4px;
  }
  .steps li b { color: var(--ink); font-weight: 700; }

  .chain { display: flex; flex-direction: column; gap: 14px; }
  .chain-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; line-height: 1.4; padding: 7px 10px; border-radius: 7px;
    background: var(--rail); border: 1.5px solid var(--frame-edge); color: var(--ink);
  }
  .chip.src { font-family: var(--font-mono); font-size: 11.5px; background: var(--risk-bg); border-color: var(--risk); }
  .chip.end { background: var(--paper); border-style: dashed; }
  .arrow { color: var(--ink-faint); font-size: 13px; }

  /* ---- wires ---- */
  .wire { fill: none; stroke: var(--ink-faint); stroke-width: 2.5; stroke-dasharray: 9 7; opacity: .7; }
  .wire-label {
    font-family: var(--font-mono); font-size: 13px; fill: var(--ink-soft);
    paint-order: stroke; stroke: var(--ground); stroke-width: 7px; stroke-linejoin: round;
  }

  /* ---- toolbar ---- */
  #toolbar {
    position: fixed; right: 20px; bottom: 20px; z-index: 5;
    display: flex; gap: 6px; align-items: center;
    background: var(--frame); border: 2px solid var(--frame-edge); border-radius: 12px;
    padding: 8px; box-shadow: var(--shadow);
  }
  #toolbar button {
    font: 600 13px/1 var(--font-body); color: var(--ink);
    background: var(--rail); border: 1.5px solid var(--frame-edge); border-radius: 8px;
    padding: 9px 12px; cursor: pointer; min-width: 38px;
  }
  #toolbar button:hover { background: var(--frame-edge); }
  #zoomlabel { font-family: var(--font-mono); font-size: 12px; min-width: 52px; text-align: center; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #hint {
    position: fixed; left: 20px; bottom: 22px; z-index: 5;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint);
    background: var(--frame); border: 1.5px solid var(--frame-edge); border-radius: 8px; padding: 8px 11px;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="viewport">
  <div id="world">
    <svg id="wires" viewBox="0 0 4600 3600" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-faint)"></path>
        </marker>
      </defs>
      <g id="wire-layer"></g>
    </svg>
  </div>
</div>

<div id="hint">ドラッグで移動 / ホイールでズーム / 凡例をクリックで絞り込み</div>

<div id="toolbar">
  <button type="button" id="zoom-out" aria-label="縮小">−</button>
  <span id="zoomlabel">100%</span>
  <button type="button" id="zoom-in" aria-label="拡大">＋</button>
  <button type="button" id="fit">全体</button>
  <button type="button" id="reset">絞り込み解除</button>
</div>

<script>
(function () {
  "use strict";

  var GAP = 120;

  function sticky(status, tag, title, body, why) {
    var w = why ? '<span class="why">' + why + "</span>" : "";
    var b = body ? "<p>" + body + "</p>" : "";
    var t = tag ? '<span class="tag">' + tag + "</span>" : "";
    return '<div class="sticky" data-status="' + status + '">' + t + "<h3>" + title + "</h3>" + b + w + "</div>";
  }

  function frame(opts) {
    return (
      "<header><h2>" + opts.title + "</h2>" +
      (opts.tally ? '<span class="tally">' + opts.tally + "</span>" : "") +
      "</header>" +
      (opts.lede ? '<p class="lede">' + opts.lede + "</p>" : "") +
      '<div class="stack">' + opts.notes.join("") + "</div>"
    );
  }

  var nodes = [];
  function node(row, x, w, cls, html, id) {
    nodes.push({ row: row, x: x, w: w, cls: cls, html: html, id: id || "" });
  }

  /* ========== row 0: 見出し・凡例・指標・出典 ========== */

  node(0, 80, 1180, "titlecard",
    '<p class="eyebrow">CAFE SNS / IMPLEMENTATION BOARD</p>' +
    "<h1>気分で見つかる、<br>行きつけと繋がる</h1>" +
    '<p class="sub">いま立っているもの と これから立てるもの</p>' +
    "<p>いま動くのは「登録して、気分で探して、書いて、人をフォローする」までの一本。" +
    "反応（いいね・コメント・保存）、店（カフェ詳細・地図）、オーナー側は、まだ1行も存在しない。" +
    "このボードは実装コードと <code>docs/</code> の設計を突き合わせた現在地。</p>" +
    '<p class="stamp">2026-09-16 時点 / branch: feature/user-profile-follow</p>');

  node(0, 1340, 520, "card",
    "<h2>付箋の色</h2>" +
    '<div id="legend">' +
    legendRow("done", "実装済み", "設計どおり動いている") +
    legendRow("partial", "部分実装", "画面はあるが要素が欠けている") +
    legendRow("todo", "未着手", "ルートもテーブルも無い") +
    legendRow("risk", "未決 / リスク", "pending-items に記録済みの穴") +
    legendRow("future", "将来の理想", "MVP後に取りにいくもの") +
    "</div>" +
    '<p class="legend-hint">クリックでその色だけを残す。もう一度クリックで解除。</p>', "legend-card");

  node(0, 1940, 1400, "tiles",
    tile("SCREENS", "16", "/ 37", "ワイヤー37画面のうち、page.tsx が存在するもの", 16 / 37) +
    tile("TABLES", "15", "/ 27", "tables.md の27テーブル中、マイグレーション済み", 15 / 27) +
    tile("MIGRATIONS", "30", "", "RLSポリシー込み。forward-only 運用", null) +
    tile("TESTS", "49", " files", "unit / RLS統合19本 / E2E 2本。統合はCI未実行", null));

  node(0, 3420, 900, "card",
    "<h2>このボードの出典</h2>" +
    '<ul class="steps">' +
    "<li><b>コード</b> — app / lib / components / supabase/migrations の実ファイル</li>" +
    "<li><b>戦略</b> — docs/product/positioning.md（幹A・幹C）</li>" +
    "<li><b>範囲</b> — docs/product/mvp-scope.md</li>" +
    "<li><b>穴の記録</b> — docs/product/pending-items.md（A / B / C / D）</li>" +
    "<li><b>画面</b> — docs/design/wireframes/README.md の37画面インデックス</li>" +
    "</ul>");

  /* ========== row 1: 実装済み / 基盤 / 未着手 ========== */

  node(1, 80, 1600, "frame", frame({
    title: "① いま動く導線",
    tally: "DONE 9 / PARTIAL 5",
    lede: "縦切りで通っているのは「サインアップ → オンボーディング → 気分で探す → 書く → フォローする」。" +
      "投稿を読むところまでは出来ていて、投稿に<strong>反応する</strong>ところが丸ごと空いている。",
    notes: [
      sticky("done", "S_SIGNUP ×3 / S_MINOR_CONSENT", "年齢ゲート付きサインアップ",
        "メール+パスワード。生年月日必須で13歳未満はブロック、13〜17歳は保護者同意フローへ。",
        "同意メールの送信基盤は未整備（B3）"),
      sticky("done", "S_LOGIN / middleware", "権限ゲート",
        "guest / pending / suspended / onboarding / user を middleware の1箇所で判定。ページ側に認可を書かない。"),
      sticky("done", "S_ONBOARD_PROFILE / AREA / INTERESTS", "オンボーディング3段",
        "ホームエリアと「好きな気分」を必ず選ばせる。幹Aの前提データがここで貯まる。"),
      sticky("done", "S_ACCOUNT_PENDING / SUSPENDED", "停止・同意待ちの受け皿", "行き止まりの画面を先に用意してある。"),
      sticky("partial", "S_HOME", "気分入り口つきホーム",
        "最上部が「今、どんなカフェ気分？」。フォロー中 / おすすめのタブ切替、PCは3カラム。",
        "サイドナビはホーム・発見・投稿の3項目だけ。検索/通知アイコン・ボトムナビは遷移先が無いので出していない（D27）"),
      sticky("partial", "S_EXPLORE", "発見タブ",
        "「おすすめ」「新着」の2サブタブ。おすすめ＝興味タグに1つでも一致する公開投稿を新着順。",
        "「近くのカフェ」は地図・座標が未整備のためタブごと非表示（D25）／スコアリング無し（D24）"),
      sticky("partial", "S_POST_DETAIL", "投稿詳細",
        "SSR。非公開・ブロック関係は存在自体を隠して404。",
        "いいね / コメント / 保存のアクション行が無い（テーブル未作成）"),
      sticky("partial", "S_USER_PROFILE_PUBLIC", "他人のプロフィール",
        "アバター・表示名・bio・3カウント・フォローボタン・投稿グリッド。",
        "バッジ・行きつけタブ・通報メニューは対応テーブルが無く非表示（D28）"),
      sticky("done", "S_POST_SHORT / S_POST_BLOG", "composer",
        "Tiptap（JSON保存）、画像アップロード、カフェ選択、厳選タグ、公開範囲、15秒デバウンスの下書き自動保存、プレビュー。"),
      sticky("done", "S_POST_SUCCESS", "投稿完了", "ピークエンド則の着地点。/new は形式選択シート。"),
      sticky("done", "follows", "フォロー",
        "楽観更新つきフォローボタン。ブロック済み相手・停止アカウントは INSERT 時に弾く。"),
      sticky("done", "_actions", "Server Actions 7本",
        "auth / onboarding / posts / drafts / feed / follows / cafes。入力は全て Zod、返りは Result 型。")
    ]
  }), "f-now");

  node(1, 1740, 1180, "frame", frame({
    title: "② 足場（DB・認可・ツーリング）",
    tally: "MIGRATIONS 30",
    lede: "認可はアプリ層に書かず RLS に寄せてある。ここが厚いぶん、画面は後から速く積める。",
    notes: [
      sticky("done", "15 tables", "実装済みテーブル",
        "areas / tags / badges / profiles / user_settings / user_interest_tags / follows / blocks / cafes / cafe_business_hours / cafe_congestion_reports / posts / post_images / post_tags / drafts"),
      sticky("done", "RLS", "認可は全部ポリシー側",
        "is_active_user / is_blocked_either_way / is_admin を共通関数化。JWTカスタムクレイムに role と status を載せる。"),

  function legendRow(status, label, note) {
    return '<button type="button" class="legend-row" data-filter="' + status + '" aria-pressed="false">' +
      '<span class="swatch" style="background:var(--' + status + '-bg);box-shadow:inset 0 0 0 3px var(--' + status + ')"></span>' +
      "<span><b>" + label + "</b><span>" + note + "</span></span></button>";
  }

  function tile(k, v, unit, n, ratio) {
    return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v +
      (unit ? "<small>" + unit + "</small>" : "") + "</div>" +
      (ratio !== null && ratio !== undefined
        ? '<div class="meter"><i style="width:' + Math.round(ratio * 100) + '%"></i></div>'
        : "") +
      '<div class="n">' + n + "</div></div>";
  }

  function chain(src, outs) {
    var html = '<div class="chain-row"><span class="chip src">' + src + "</span>";
    for (var i = 0; i < outs.length; i++) {
      html += '<span class="arrow">&rarr;</span><span class="chip' + (i === outs.length - 1 ? " end" : "") + '">' + outs[i] + "</span>";

  }

    rowTop[r] = top;
    var h = 0;
    els.forEach(function (el, i) {
      if (nodes[i].row !== r) return;
      el.style.top = rowTop[r] + "px";
      h = Math.max(h, el.offsetHeight);

  /* ---------- wires ---------- */
  function box(id) {
    var el = document.getElementById(id);
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  }
  function wire(fromId, toId, label) {
    var a = box(fromId), b = box(toId), p, lx, ly;
    if (Math.abs(a.y - b.y) < 40) {
      // 横並び: 右端 → 左端
      var ay = a.y + Math.min(a.h, b.h) * 0.42, by = b.y + Math.min(a.h, b.h) * 0.42;
      var x1 = a.x + a.w, x2 = b.x;
      if (x1 > x2) { x1 = a.x; x2 = b.x + b.w; }
      var mid = (x1 + x2) / 2;
      p = "M" + x1 + " " + ay + " C " + mid + " " + ay + ", " + mid + " " + by + ", " + x2 + " " + by;
      lx = mid; ly = Math.min(ay, by) - 16;
    } else {
      // 縦: 下端 → 上端
      var ax = a.x + a.w * 0.5, bx = b.x + b.w * 0.5;
      var y1 = a.y + a.h, y2 = b.y;
      var my = (y1 + y2) / 2;
      p = "M" + ax + " " + y1 + " C " + ax + " " + my + ", " + bx + " " + my + ", " + bx + " " + y2;
      lx = (ax + bx) / 2; ly = my + 5;
    }
    var layer = document.getElementById("wire-layer");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", p);
    path.setAttribute("class", "wire");
    path.setAttribute("marker-end", "url(#arw)");
    layer.appendChild(path);
    var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", lx);
    text.setAttribute("y", ly);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "wire-label");
    text.textContent = label;
    layer.appendChild(text);
  }
  wire("f-base", "f-now", "RLSが認可を全部持つ");

  /* ---------- pan & zoom ---------- */
  var vp = document.getElementById("viewport");
  var scale = 1, tx = 0, ty = 0;
  var label = document.getElementById("zoomlabel");

  function apply() {
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
    label.textContent = Math.round(scale * 100) + "%";
  }
  function clamp(s) { return Math.min(2.2, Math.max(0.08, s)); }
  function zoomAt(cx, cy, factor) {
    var next = clamp(scale * factor);
    factor = next / scale;
    tx = cx - (cx - tx) * factor;
    ty = cy - (cy - ty) * factor;
    scale = next;
    apply();
  }
  function fit() {
    var pad = 60;
    var s = clamp(Math.min((vp.clientWidth - pad * 2) / (contentW + 80), (vp.clientHeight - pad * 2) / (contentH + 80)));
    scale = s;
    tx = (vp.clientWidth - (contentW + 80) * s) / 2;
    ty = (vp.clientHeight - (contentH + 80) * s) / 2;
    apply();
  }

  vp.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 0) {
      zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
    }
  }, { passive: false });

  var dragging = false, lastX = 0, lastY = 0, pid = null;
  vp.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".legend-row")) return;
    dragging = true; pid = e.pointerId; lastX = e.clientX; lastY = e.clientY;
    vp.classList.add("dragging");
    vp.setPointerCapture(pid);
  });
  vp.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    vp.classList.remove("dragging");
    if (pid !== null && vp.hasPointerCapture(pid)) vp.releasePointerCapture(pid);
  }
  vp.addEventListener("pointerup", endDrag);
  vp.addEventListener("pointercancel", endDrag);

  document.getElementById("zoom-in").addEventListener("click", function () { zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.2); });
  document.getElementById("zoom-out").addEventListener("click", function () { zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1 / 1.2); });
  document.getElementById("fit").addEventListener("click", fit);

  /* ---------- filter ---------- */
  var active = null;
  var stickies = Array.prototype.slice.call(document.querySelectorAll(".sticky"));
  function applyFilter() {
    stickies.forEach(function (s) {
      s.classList.toggle("dim", active !== null && s.dataset.status !== active);
    });
    document.querySelectorAll(".legend-row").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.filter === active));
    });
  }
  document.querySelectorAll(".legend-row").forEach(function (b) {
    b.addEventListener("click", function () {
      active = active === b.dataset.filter ? null : b.dataset.filter;
      applyFilter();
    });
  });
  document.getElementById("reset").addEventListener("click", function () { active = null; applyFilter(); });

  window.addEventListener("resize", function () { if (scale < 0.3) fit(); });
  fit();
})();
