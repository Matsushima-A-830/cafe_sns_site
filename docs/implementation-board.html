<style>

    --ink: #2e1c12;
    --ink-soft: #5b3a2a;
    --ink-faint: #9a6b4a;
    --ground: #fff8f1;
    --ground-dot: #e3cdb5;
    --paper: #ffffff;
    --frame: #ffffff;
    --frame-edge: #ecd2b8;
    --rail: #fff1e3;
    --accent: #9a6b4a;
    --done: #4a7c59;
    --done-bg: #e8f0e8;
    --partial: #c77f3e;
    --partial-bg: #fdeedd;
    --todo: #8a7e74;
    --todo-bg: #f1ece7;
    --risk: #a94438;
    --risk-bg: #fbe6e2;
    --future: #5b7c99;
    --future-bg: #e6eef4;
    --shadow: 0 1px 2px rgba(46, 28, 18, .1), 0 6px 18px rgba(46, 28, 18, .08);
    --shadow-frame: 0 2px 30px rgba(46, 28, 18, .07);
    --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #fff1e3;
      --ink-soft: #e2c8ae;
      --ink-faint: #b08f75;
      --ground: #241710;
      --ground-dot: #4a3326;
      --paper: #33231a;
      --frame: #2c1d15;
      --frame-edge: #4f382a;
      --rail: #3b2820;
      --accent: #d9b38c;
      --done: #8dc09b;
      --done-bg: #2b3a2f;
      --partial: #e7ab6b;
      --partial-bg: #443023;
      --todo: #b2a397;
      --todo-bg: #3a2e27;
      --risk: #e4907f;
      --risk-bg: #46281f;
      --future: #9cc0da;
      --future-bg: #2a3640;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 20px rgba(0, 0, 0, .3);
      --shadow-frame: 0 2px 30px rgba(0, 0, 0, .28);
    }
  }

  :root[data-theme="dark"] {
    --ink: #fff1e3;
    --ink-soft: #e2c8ae;
    --ink-faint: #b08f75;
    --ground: #241710;
    --ground-dot: #4a3326;
    --paper: #33231a;
    --frame: #2c1d15;
    --frame-edge: #4f382a;
    --rail: #3b2820;
    --accent: #d9b38c;
    --done: #8dc09b;
    --done-bg: #2b3a2f;
    --partial: #e7ab6b;
    --partial-bg: #443023;
    --todo: #b2a397;
    --todo-bg: #3a2e27;
    --risk: #e4907f;
    --risk-bg: #46281f;
    --future: #9cc0da;
    --future-bg: #2a3640;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 20px rgba(0, 0, 0, .3);
    --shadow-frame: 0 2px 30px rgba(0, 0, 0, .28);
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    height: 100vh;
  }

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--ground-dot) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
  }
  #viewport.dragging { cursor: grabbing; }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .node { position: absolute; box-sizing: border-box; }

  /* ---- frames (FigJam のセクション) ---- */
  .frame {
    background: var(--frame);
    border: 2px solid var(--frame-edge);
    border-radius: 18px;
    box-shadow: var(--shadow-frame);
    padding: 24px 24px 28px;
  }
  .frame > header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .frame h2 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: .01em;
    margin: 0;
  }
  .frame .tally {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: .04em;
  }
  .frame .lede {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 8px 0 20px;
    max-width: 62ch;
  }

  .stack { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }

  /* ---- 付箋 ---- */
  .sticky {
    width: 236px;
    box-sizing: border-box;
    padding: 14px 14px 16px;
    border-radius: 4px;
    background: var(--paper);
    box-shadow: var(--shadow);
    border-top: 5px solid var(--todo);
    transition: opacity .18s ease;
  }
  .sticky .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--ink-soft);
    background: var(--rail);
    border-radius: 3px;
    padding: 2px 6px;
    margin-bottom: 8px;
  }
  .sticky h3 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    line-height: 1.45;
    margin: 0 0 6px;
  }
  .sticky p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--ink-soft);
  }
  .sticky .why {
    display: block;
    margin-top: 8px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-faint);
    border-left: 2px solid var(--frame-edge);
    padding-left: 8px;
  }
  .sticky[data-status="done"]    { border-top-color: var(--done);    background: var(--done-bg); }
  .sticky[data-status="partial"] { border-top-color: var(--partial); background: var(--partial-bg); }
  .sticky[data-status="todo"]    { border-top-color: var(--todo);    background: var(--todo-bg); }
  .sticky[data-status="risk"]    { border-top-color: var(--risk);    background: var(--risk-bg); }
  .sticky[data-status="future"]  { border-top-color: var(--future);  background: var(--future-bg); }
  .sticky.dim { opacity: .14; }

  /* ---- 見出しカード ---- */
  .titlecard { background: var(--ink); color: var(--ground); border-radius: 18px; padding: 32px 34px; box-shadow: var(--shadow-frame); }
  .titlecard .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .18em; opacity: .7; margin: 0 0 14px; }
  .titlecard h1 { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  .titlecard .sub { font-family: var(--font-display); font-size: 19px; font-weight: 500; margin: 0 0 18px; opacity: .85; }
  .titlecard p { font-size: 13.5px; line-height: 1.8; margin: 0; opacity: .8; max-width: 60ch; }
  .titlecard .stamp { font-family: var(--font-mono); font-size: 12px; margin-top: 20px; opacity: .6; }

  /* ---- 通常カード ---- */
  .card { background: var(--frame); border: 2px solid var(--frame-edge); border-radius: 14px; padding: 22px 22px 24px; box-shadow: var(--shadow-frame); }
  .card h2 { font-family: var(--font-display); font-size: 18px; font-weight: 900; margin: 0 0 14px; }
  .legend-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; border: 0; background: none; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .legend-row:hover { background: var(--rail); }
  .legend-row .swatch { width: 18px; height: 18px; border-radius: 3px; flex: none; margin-top: 2px; }
  .legend-row b { font-family: var(--font-display); font-size: 14px; display: block; }
  .legend-row span { font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
  .legend-row[aria-pressed="true"] { background: var(--rail); box-shadow: inset 0 0 0 2px var(--accent); }
  .legend-hint { font-size: 11.5px; color: var(--ink-faint); margin: 12px 2px 0; line-height: 1.6; }
  .sw-done    { background: var(--done-bg);    box-shadow: inset 0 0 0 3px var(--done); }
  .sw-partial { background: var(--partial-bg); box-shadow: inset 0 0 0 3px var(--partial); }
  .sw-todo    { background: var(--todo-bg);    box-shadow: inset 0 0 0 3px var(--todo); }
  .sw-risk    { background: var(--risk-bg);    box-shadow: inset 0 0 0 3px var(--risk); }
  .sw-future  { background: var(--future-bg);  box-shadow: inset 0 0 0 3px var(--future); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile { background: var(--frame); border: 2px solid var(--frame-edge); border-radius: 14px; padding: 20px; box-shadow: var(--shadow-frame); }
  .tile .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--ink-faint); }
  .tile .v { font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 1.15; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 18px; font-weight: 700; color: var(--ink-faint); }
  .tile .n { font-size: 12px; color: var(--ink-soft); margin-top: 6px; line-height: 1.55; }
  .meter { height: 7px; border-radius: 4px; background: var(--rail); margin-top: 12px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .m0 { width: 0 } .m5 { width: 5% } .m10 { width: 10% } .m15 { width: 15% } .m20 { width: 20% }
  .m25 { width: 25% } .m30 { width: 30% } .m35 { width: 35% } .m40 { width: 40% } .m45 { width: 45% }
  .m50 { width: 50% } .m55 { width: 55% } .m60 { width: 60% } .m65 { width: 65% } .m70 { width: 70% }
  .m75 { width: 75% } .m80 { width: 80% } .m85 { width: 85% } .m90 { width: 90% } .m95 { width: 95% }
  .m100 { width: 100% }

  /* ---- ホライズンのレーン ---- */
  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  .lane { border: 2px dashed var(--frame-edge); border-radius: 14px; padding: 18px; background: var(--rail); }
  .lane > h3 { font-family: var(--font-display); font-weight: 900; font-size: 19px; margin: 0 0 2px; }
  .lane > .when { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); letter-spacing: .06em; margin: 0 0 14px; }
  .lane .stack { gap: 12px; }
  .lane .sticky { width: 100%; }

  .steps { counter-reset: step; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .steps li { position: relative; padding-left: 34px; font-size: 13px; line-height: 1.65; color: var(--ink-soft); }
  .steps li::before {
    counter-increment: step; content: counter(step, decimal-leading-zero);
    position: absolute; left: 0; top: 1px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--accent); border: 1.5px solid var(--frame-edge); border-radius: 4px; padding: 1px 4px;
  }
  .steps li b { color: var(--ink); font-weight: 700; }

  .chain { display: flex; flex-direction: column; gap: 14px; }
  .chain-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; line-height: 1.4; padding: 7px 10px; border-radius: 7px;
    background: var(--rail); border: 1.5px solid var(--frame-edge); color: var(--ink);
  }
  .chip.src { font-family: var(--font-mono); font-size: 11.5px; background: var(--risk-bg); border-color: var(--risk); }
  .chip.end { background: var(--paper); border-style: dashed; }
  .arrow { color: var(--ink-faint); font-size: 13px; }

  /* ---- コネクタ ---- */
  .wire { fill: none; stroke: var(--ink-faint); stroke-width: 2.5; stroke-dasharray: 9 7; opacity: .7; }
  .wire-label {
    font-family: var(--font-mono); font-size: 13px; fill: var(--ink-soft);
    paint-order: stroke; stroke: var(--ground); stroke-width: 7px; stroke-linejoin: round;
  }

  /* ---- ツールバー ---- */
  #toolbar {
    position: fixed; right: 20px; bottom: 20px; z-index: 5;
    display: flex; gap: 6px; align-items: center;
    background: var(--frame); border: 2px solid var(--frame-edge); border-radius: 12px;
    padding: 8px; box-shadow: var(--shadow);
  }
  #toolbar button {
    font: 600 13px/1 var(--font-body); color: var(--ink);
    background: var(--rail); border: 1.5px solid var(--frame-edge); border-radius: 8px;
    padding: 9px 12px; cursor: pointer; min-width: 38px;
  }
  #toolbar button:hover { background: var(--frame-edge); }
  #zoomlabel { font-family: var(--font-mono); font-size: 12px; min-width: 52px; text-align: center; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #hint {
    position: fixed; left: 20px; bottom: 22px; z-index: 5;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint);
    background: var(--frame); border: 1.5px solid var(--frame-edge); border-radius: 8px; padding: 8px 11px;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* 付箋のフェードだけがアニメーションなので、同じ詳細度で打ち消す（!important は使わない） */
  @media (prefers-reduced-motion: reduce) { .sticky { transition: none; } }
</style>

              "body": "常連数の推移と投稿パターン分析、行きつけの可視化。オーナーが継続来店を実感できるところまで。"
            },
            {

              "body": "朝活カフェ部などの趣味グループ、カフェ巡り会、チェックイン、似た好みのマッチング。MVP後に検討（C5）。"

              "body": "社会的証明（今週◯人が保存）・希少性・アンカリング。いずれもデータ蓄積が前提で、先に入れても嘘になる。"
            },
            {

              "title": "アプリ化と収益化",
              "body": "技術選定（C2）と収益化フラグ（C3）。ブラウザ版の手応えを見てから。"
            },
            {

              "title": "やらないことを守る",
              "body": "DM・ストーリーズ・映えフィルタ・ショップ誘導は入れない。Instagramでもできる機能は3問を通してから。"

  ],
  "wires": [
    {
      "from": "f-base",

    },

    },

<script>
(() => {
  "use strict";

  const DATA = JSON.parse(document.getElementById("board-data").textContent);
  const ROW_GAP = 120;

  const STATUS_LABELS = [
    ["done", "実装済み", "設計どおり動いている"],
    ["partial", "部分実装", "画面はあるが要素が欠けている"],
    ["todo", "未着手", "ルートもテーブルも無い"],
    ["risk", "未決 / リスク", "pending-items に記録済みの穴"],
    ["future", "将来の理想", "MVP後に取りにいくもの"]
  ];

  function sticky(n) {
    return '<div class="sticky" data-status="' + n.status + '">' +
      (n.tag ? `<span class="tag">${n.tag}</span>` : "") +
      "<h3>" + n.title + "</h3>" +
      (n.body ? `<p>${n.body}</p>` : "") +
      (n.why ? `<span class="why">${n.why}</span>` : "") +
      "</div>";
  }

  // tally が "auto" のときは付箋の色から数える（手で数えると必ずズレるため）
  function autoTally(s) {
    const count = {};
    (s.notes || []).forEach((n) => { count[n.status] = (count[n.status] || 0) + 1; });
    return STATUS_LABELS
      .filter((l) => count[l[0]])
      .map((l) => `${l[0].toUpperCase()} ${count[l[0]]}`)
      .join(" / ");
  }

  function header(s) {
    const tally = s.tally === "auto" ? autoTally(s) : s.tally;
    return "<header><h2>" + s.title + "</h2>" +
      (tally ? `<span class="tally">${tally}</span>` : "") + "</header>" +
      (s.lede ? `<p class="lede">${s.lede}</p>` : "");
  }

  const BUILDERS = {
    title: () => {
      const m = DATA.meta;
      return '<p class="eyebrow">' + m.eyebrow + "</p><h1>" + m.headline + "</h1>" +
        '<p class="sub">' + m.sub + "</p><p>" + m.intro + "</p>" +
        '<p class="stamp">' + m.updatedAt + " 時点 / " + m.ref + "</p>";
    },
    legend: () => {
      const rows = STATUS_LABELS.map((s) => '<button type="button" class="legend-row" data-filter="' + s[0] + '" aria-pressed="false">' +
          '<span class="swatch sw-' + s[0] + '"></span>' +
          "<span><b>" + s[1] + "</b><span>" + s[2] + "</span></span></button>").join("");
      return "<h2>付箋の色</h2><div>" + rows + "</div>" +
        '<p class="legend-hint">クリックでその色だけを残す。もう一度クリックで解除。</p>';
    },
    metrics: () => DATA.metrics.map((t) => '<div class="tile"><div class="k">' + t.k + '</div>' +
          '<div class="v">' + t.v + (t.unit ? `<small>${t.unit}</small>` : "") + "</div>" +
          (t.ratio === null || t.ratio === undefined
            ? ""
            : `<div class="meter"><i class="m${Math.round(t.ratio / 5) * 5}"></i></div>`) +
          '<div class="n">' + t.note + "</div></div>").join(""),
    list: (s) => "<h2>" + s.title + '</h2><ul class="steps">' +
        s.items.map((i) => `<li>${i}</li>`).join("") + "</ul>",
    frame: (s) => `${header(s)}<div class="stack">${s.notes.map(sticky).join("")}</div>`,
    chain: (s) => {
      const rows = s.chains.map((c) => {
        let html = `<div class="chain-row"><span class="chip src">${c.src}</span>`;
        c.outs.forEach((o, i) => {
          html += '<span class="arrow">&rarr;</span><span class="chip' +
            (i === c.outs.length - 1 ? " end" : "") + '">' + o + "</span>";
        });
        return `${html}</div>`;
      }).join("");
      return `${header(s)}<div class="chain">${rows}</div>`;
    },
    lanes: (s) => {
      const lanes = s.lanes.map((l) => '<div class="lane"><h3>' + l.title + '</h3><p class="when">' + l.when + "</p>" +
          '<div class="stack">' + l.notes.map(sticky).join("") + "</div></div>").join("");
      return `${header(s)}<div class="lanes">${lanes}</div>`;
    }
  };

  const CLASSES = { title: "titlecard", legend: "card", metrics: "tiles", list: "card", frame: "frame", chain: "frame", lanes: "frame" };

  /* ---------- 描画 ---------- */
  const world = document.getElementById("world");
  const els = DATA.sections.map((s) => {
    const el = document.createElement("div");
    el.className = `node ${CLASSES[s.kind]}`;
    if (s.id) el.id = s.id;
    el.style.left = `${s.x}px`;
    el.style.width = `${s.w}px`;
    el.innerHTML = BUILDERS[s.kind](s);
    world.appendChild(el);
    return el;
  });

  // 行ごとに上端を揃え、その行の最大高さ + ROW_GAP で次の行へ送る
  const rowCount = DATA.sections.reduce((m, s) => Math.max(m, s.row), 0) + 1;
  let top = 60, bottom = 0;
  for (let r = 0; r < rowCount; r++) {
    let h = 0;
    els.forEach((el, i) => {
      if (DATA.sections[i].row !== r) return;
      el.style.top = `${top}px`;
      h = Math.max(h, el.offsetHeight);
    });
    bottom = top + h;
    top = bottom + ROW_GAP;
  }

  const contentW = DATA.sections.reduce((m, s) => Math.max(m, s.x + s.w), 0) + 80;
  const contentH = bottom + 80;
  world.style.width = `${contentW}px`;
  world.style.height = `${contentH}px`;
  document.getElementById("wires").setAttribute("viewBox", `0 0 ${contentW} ${contentH}`);

  /* ---------- コネクタ ---------- */
  function box(id) {
    const el = document.getElementById(id);
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  }
  const layer = document.getElementById("wire-layer");
  const SVGNS = "http://www.w3.org/2000/svg";

  DATA.wires.forEach((w) => {
    if (!document.getElementById(w.from) || !document.getElementById(w.to)) return;
    let a = box(w.from), b = box(w.to), d, lx, ly;
    if (Math.abs(a.y - b.y) < 40) {
      const ay = a.y + Math.min(a.h, b.h) * 0.42, by = ay;
      let x1 = a.x + a.w, x2 = b.x;
      if (x1 > x2) { x1 = a.x; x2 = b.x + b.w; }
      const mx = (x1 + x2) / 2;
      d = `M${x1} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${x2} ${by}`;
      lx = mx; ly = ay - 16;
    } else {
      const ax = a.x + a.w * 0.5, bx = b.x + b.w * 0.5;
      const y1 = a.y + a.h, y2 = b.y;
      const my = (y1 + y2) / 2;
      d = `M${ax} ${y1} C ${ax} ${my}, ${bx} ${my}, ${bx} ${y2}`;
      lx = (ax + bx) / 2; ly = my + 5;
    }
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "wire");
    path.setAttribute("marker-end", "url(#arw)");
    layer.appendChild(path);
    const text = document.createElementNS(SVGNS, "text");
    text.setAttribute("x", lx);
    text.setAttribute("y", ly);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "wire-label");
    text.textContent = w.label;
    layer.appendChild(text);
  });

  /* ---------- パン・ズーム ---------- */
  const vp = document.getElementById("viewport");
  const label = document.getElementById("zoomlabel");
  let scale = 1, tx = 0, ty = 0;

  function apply() {
    world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    label.textContent = `${Math.round(scale * 100)}%`;
  }
  function clamp(s) { return Math.min(2.2, Math.max(0.08, s)); }
  function zoomAt(cx, cy, factor) {
    const next = clamp(scale * factor);
    factor = next / scale;
    tx = cx - (cx - tx) * factor;
    ty = cy - (cy - ty) * factor;
    scale = next;
    apply();
  }
  // 関数名を fit にしない: Biome の noFocusedTests が「フォーカスされたテスト」と誤検知し、
  // unsafe fix が it() へ書き換えてボードが真っ白になる（実際に一度壊れた）
  function fitToScreen() {
    const pad = 60;
    scale = clamp(Math.min((vp.clientWidth - pad * 2) / contentW, (vp.clientHeight - pad * 2) / contentH));
    tx = (vp.clientWidth - contentW * scale) / 2;
    ty = (vp.clientHeight - contentH * scale) / 2;
    apply();
  }

  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  let dragging = false, lastX = 0, lastY = 0, pid = null;
  vp.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".legend-row")) return;
    dragging = true; pid = e.pointerId; lastX = e.clientX; lastY = e.clientY;
    vp.classList.add("dragging");
    vp.setPointerCapture(pid);
  });
  vp.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    vp.classList.remove("dragging");
    if (pid !== null && vp.hasPointerCapture(pid)) vp.releasePointerCapture(pid);
  }
  vp.addEventListener("pointerup", endDrag);
  vp.addEventListener("pointercancel", endDrag);

  document.getElementById("zoom-in").addEventListener("click", () => { zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.2); });
  document.getElementById("zoom-out").addEventListener("click", () => { zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1 / 1.2); });
  document.getElementById("fit").addEventListener("click", fitToScreen);

  /* ---------- 絞り込み ---------- */
  let active = null;
  const stickies = Array.prototype.slice.call(document.querySelectorAll(".sticky"));
  function applyFilter() {
    stickies.forEach((s) => {
      s.classList.toggle("dim", active !== null && s.dataset.status !== active);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".legend-row"), (b) => {
      b.setAttribute("aria-pressed", String(b.dataset.filter === active));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".legend-row"), (b) => {
    b.addEventListener("click", () => {
      active = active === b.dataset.filter ? null : b.dataset.filter;
      applyFilter();
    });
  });
  document.getElementById("reset").addEventListener("click", () => { active = null; applyFilter(); });

  window.addEventListener("resize", () => { if (scale < 0.3) fitToScreen(); });
  fitToScreen();
})();
</script>
