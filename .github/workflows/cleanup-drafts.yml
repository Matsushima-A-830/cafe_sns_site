name: Cleanup Expired Drafts

# 期限切れ下書き（drafts.expires_at < now()）と、それが参照する Storage の画像を
# 日次で削除する。参照時にも expires_at で絞っているため、このジョブが遅延・停止しても
# ユーザーには見えない（docs/product/pending-items.md D3 / A6）。
#
# GitHub Actions の schedule は指定時刻には走らない（nightly.yml で実測: 最大3時間40分遅延）。
# また 60日間リポジトリに活動がないと自動停止するので、長期中断明けは workflow_dispatch で
# 一度手動起動して再開させること。
on:
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 = JST 02:00（あくまで目安）
  workflow_dispatch:

concurrency:
  group: cleanup-drafts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Call cleanup-drafts endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Result型規約（error-catalog.md）でHTTPステータスは常に200固定のため、
      # 成否は body の ok フィールドで判定する
      - name: Call /api/cron/cleanup-drafts
        run: |
          BODY=$(curl -s -X POST "${SITE_URL}/api/cron/cleanup-drafts" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "$BODY"
          OK=$(echo "$BODY" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "::error::cleanup-drafts が失敗しました: $BODY"
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
