name: Integration

# tests/integration/** は実 Supabase を要求するため、Supabase を起動しない
# ci.yml の Vitest ジョブ（pnpm test:run）からは除外してこちらで流す。
#
# ワークフロー自体の trigger には paths-ignore を付けない。必須ステータスチェックに
# 指定しているため、path フィルタでスキップすると GitHub が合格を合成せず、
# docs だけの PR が「Waiting for status to be reported」で永久に止まる
# （詳細は docs/operations/git-workflow.md #ブランチ保護）。
# docs だけの変更で統合テストを省きたい場合は、job 単位の if 条件（changes ジョブ）
# でスキップする。skipped は必須ステータスチェックを満たす
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ci.yml の changes ジョブと同じ判定（docs/**・*.md・.claude/** だけなら code=false）。
  # 判定自体が失敗したら安全側（code=true）に倒す
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for non-docs changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"; then
            echo "::warning::git diff に失敗。安全側に倒して code=true とする"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "変更ファイル:"
          cat "$RUNNER_TEMP/changed.txt"

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|.claude/*) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code 判定: $code"

  supabase-integration:
    name: Supabase Integration
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 統合テストが触るのは db / kong / gotrue / postgrest / storage-api だけ。
      # studio・analytics(logflare+vector)・edge-runtime は重いイメージを pull して
      # health 待ちするだけなので除外する。realtime と imgproxy はアプリ側に利用箇所が無い。
      # start が migrations と seed.sql を適用するため、db reset は不要
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor,realtime,imgproxy

      # 接続情報は tests/helpers/supabase.ts が supabase status から読む
      - name: Integration tests
        run: pnpm test:integration

      # supabase status はエンドポイントと鍵を出すだけで、落ちた原因は分からない
      - name: Dump Supabase container logs
        if: failure()
        run: docker ps -a --filter name=supabase --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "===== {} ====="; docker logs --tail 200 {} 2>&1'
