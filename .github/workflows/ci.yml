name: CI

# ワークフロー自体の trigger には paths-ignore を付けない。必須ステータスチェックに
# 登録した時、GitHub は path フィルタでスキップしたワークフローに合格ステータスを
# 合成しないため、docs だけの PR が「Waiting for status to be reported」で永久に
# 止まる（詳細は docs/operations/git-workflow.md #ブランチ保護）。
# docs だけの変更で lint/typecheck/test/build を省きたい場合は、job 単位の if 条件
# （changes ジョブ）でスキップする。skipped は必須ステータスチェックを満たす
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更ファイルが docs/**・*.md・.claude/** だけなら code=false にし、
  # 下の2ジョブを skip する。判定自体が失敗したら安全側（code=true）に倒す
  # — 誤って実コードの変更を素通りさせるより、誤って余分に実行するほうが安全
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for non-docs changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"; then
            echo "::warning::git diff に失敗。安全側に倒して code=true とする"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "変更ファイル:"
          cat "$RUNNER_TEMP/changed.txt"

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|.claude/*) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code 判定: $code"

  lint-typecheck-test:
    name: Lint / Typecheck / Test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: Design system check
        run: pnpm lint:design

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test:run

  # lefthook の commit-msg は git hook なので、Actions 上の bot コミットでは走らない。
  # エージェントが作ったコミットも Conventional Commits に従わせるため CI 側でも検査する
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, lint-typecheck-test]
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      needs.lint-typecheck-test.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next.js build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
