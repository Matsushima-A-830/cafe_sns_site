name: E2E

# paths-ignore は付けない（理由は integration.yml と同じ）
on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      # サインアップ〜オンボーディングの E2E は実際の Auth (OTPメール送信含む) を要るため、
      # dummy 値ではなくローカル Supabase を使う (integration.yml と同じ構成)
      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Apply migrations
        run: pnpm exec supabase db reset

      # NEXT_PUBLIC_* はビルド時に静的に埋め込まれるため、build より前に $GITHUB_ENV へ出す
      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      # playwright.config.ts の webServer が `pnpm start` を叩くため、先にビルドが必要
      - name: Build
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # supabase status はエンドポイントと鍵を出すだけで、落ちた原因は分からない
      - name: Dump Supabase container logs
        if: failure()
        run: docker ps -a --filter name=supabase --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "===== {} ====="; docker logs --tail 200 {} 2>&1'
