name: E2E

# paths-ignore は付けない（理由は integration.yml と同じ）
on:
  pull_request:
  push:
    branches: [main]
  # 夜間ジョブ (nightly.yml) から webkit 込みで呼ぶための入口。
  # 既存トリガーは変えていないので、必須ステータスチェック名にも影響しない
  workflow_call:
    inputs:
      full:
        description: webkit / mobile-safari を含む 4 project すべてで回す
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Safari は MVP 開発期間中は非対応（CLAUDE.md）。4 project 全部を毎PRで回すと
      # 実行時間がちょうど倍になるため、PR は Chromium 系のみ。webkit 系は
      # main へのマージ後と、`safari` ラベルを付けた PR で検証する
      - name: Decide browser set
        id: browsers
        # github コンテキストは PR タイトル等の任意入力を含むため run: に直接展開しない
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_RUN: ${{ inputs.full }}
          HAS_SAFARI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'safari') }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$FULL_RUN" = "true" ] || [ "$HAS_SAFARI_LABEL" = "true" ]; then
            echo "install=chromium webkit" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium --project=webkit --project=mobile-chrome --project=mobile-safari" >> "$GITHUB_OUTPUT"
            echo "set=full" >> "$GITHUB_OUTPUT"
          else
            echo "install=chromium" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium --project=mobile-chrome" >> "$GITHUB_OUTPUT"
            echo "set=chromium" >> "$GITHUB_OUTPUT"
          fi

      # キャッシュキーにブラウザセットを含める。含めないと chromium のみのキャッシュを
      # webkit 実行時に hit させてしまい、webkit が未インストールのまま走る
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browsers.outputs.set }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ steps.browsers.outputs.install }}

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ steps.browsers.outputs.install }}

      # サインアップ〜オンボーディングの E2E は実際の Auth (OTPメール送信含む) を要るため、
      # dummy 値ではなくローカル Supabase を使う (integration.yml と同じ構成)。
      # E2E が触るのは db / kong / gotrue / postgrest / storage-api / mailpit だけなので
      # それ以外は除外する。start が migrations と seed.sql を適用するため db reset は不要
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor,realtime,imgproxy

      # NEXT_PUBLIC_* はビルド時に静的に埋め込まれるため、build より前に $GITHUB_ENV へ出す。
      # eval で丸ごと展開すると鍵の値に &, ;, 空白等が混ざった場合にコマンド実行されうるため、
      # 必要な3キーだけを grep で安全に抜き出す
      - name: Export Supabase env
        run: |
          STATUS=$(pnpm exec supabase status -o env)
          extract() { echo "$STATUS" | grep -E "^$1=" | sed -E 's/^[A-Z0-9_]+="(.*)"$/\1/'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(extract API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(extract ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(extract SERVICE_ROLE_KEY)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      # .next/cache はソース変更後も前回ビルドの成果物を使って差分だけ再ビルドできる。
      # 完全一致しなければ直近の pnpm-lock.yaml 向けキャッシュにフォールバックする
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # playwright.config.ts の webServer が `pnpm start` を叩くため、先にビルドが必要
      - name: Build
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e ${{ steps.browsers.outputs.projects }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # supabase status はエンドポイントと鍵を出すだけで、落ちた原因は分からない
      - name: Dump Supabase container logs
        if: failure()
        run: docker ps -a --filter name=supabase --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "===== {} ====="; docker logs --tail 200 {} 2>&1'
