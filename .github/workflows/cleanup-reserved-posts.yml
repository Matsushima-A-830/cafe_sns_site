name: Cleanup Reserved Posts

# reservePost / reserveOfficialPost が作った status='hidden' の予約投稿が
# 7日以上 finalize（createPost / createOfficialPost）されないまま放置されたら、
# 紐づく Storage の画像フォルダとともに日次で削除する（docs/product/pending-items.md D19）。
#
# GitHub Actions の schedule は指定時刻には走らない（nightly.yml で実測: 最大3時間40分遅延）。
# また 60日間リポジトリに活動がないと自動停止するので、長期中断明けは workflow_dispatch で
# 一度手動起動して再開させること。
on:
  schedule:
    - cron: "20 17 * * *" # UTC 17:20 = JST 02:20（cleanup-drafts と時間をずらす目安）
  workflow_dispatch:

concurrency:
  group: cleanup-reserved-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Call cleanup-reserved-posts endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Result型規約（error-catalog.md）でHTTPステータスは常に200固定のため、
      # 成否は body の ok フィールドで判定する
      - name: Call /api/cron/cleanup-reserved-posts
        run: |
          BODY=$(curl -s -X POST "${SITE_URL}/api/cron/cleanup-reserved-posts" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "$BODY"
          OK=$(echo "$BODY" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "::error::cleanup-reserved-posts が失敗しました: $BODY"
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
